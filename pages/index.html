<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fishexperiments</title>
    <link rel="icon" href="/img/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/css/style.css" type="text/css" />
  </head>
  <body>
    {header}

    <main>
      <a class="title" href="/">
        <img class="title" src="/img/title.png" alt="title" />
      </a>

      <hr />

      <span>This website has been visited {visits} times</span>

      <hr />

      <span id="inThreadSpan" style="display: none">
        You are in a thread. Clicking "post" will make a reply to the original
        poster.
        <a id="inThreadAnchor" href="/">Return</a>
      </span>

      <form id="postForm">
        <div class="post-grid">
          <div class="row">
            <label for="name">Name</label>
            <span>
              <input
                id="name"
                name="name"
                type="text"
                placeholder="Anonymous"
              />
            </span>
          </div>

          <div class="row">
            <label for="tripcode">Tripcode</label>
            <span>
              <input id="tripcode" name="tripcode" type="text" />
            </span>
          </div>

          <div class="row">
            <label for="postFormContent">Content</label>
            <span>
              <textarea id="postFormContent" name="content"></textarea>
              <br />

              <details>
                <summary>Emoji</summary>
                <div id="emojiPicker">
                  <img
                    data-emoji="despair"
                    src="/img/emoji/despair.gif"
                    alt=":despair:"
                  />
                  <img
                    data-emoji="nuko"
                    src="/img/emoji/nuko.gif"
                    alt=":nuko:"
                  />
                </div>
              </details>
            </span>
          </div>

          <div class="row">
            <label for="file">File</label>
            <span>
              <input id="file" name="file" type="file" />
            </span>
          </div>
        </div>

        <input type="submit" value="Post" id="postFormSubmit" />
      </form>

      <hr />

      <div id="posts"></div>
    </main>

    <script src="/js/index.js"></script>
  </body>
</html>
