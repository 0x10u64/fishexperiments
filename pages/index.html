<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fishexperiments</title>
    <link rel="icon" href="/img/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/css/style.css" type="text/css" />
  </head>
  <body>
    {header}

    <main>
      <a class="title" href="/">
        <img
          class="title"
          src="/img/title.png"
          alt="title"
          width="720"
          height="240"
        />
      </a>

      <p>This website has been visited {visits} times</p>

      <hr />

      {threadNotice}

      <form id="postForm">
        <div class="post-grid">
          <div class="row">
            <label for="name">Name</label>
            <span>
              <input
                id="name"
                name="name"
                type="text"
                placeholder="Anonymous"
              />
            </span>
          </div>

          <div class="row">
            <label for="tripcode">Tripcode</label>
            <span>
              <input id="tripcode" name="tripcode" type="text" />
            </span>
          </div>

          <div class="row">
            <label for="postFormContent">Content</label>
            <span>
              <textarea id="postFormContent" name="content"></textarea>
              <p>Basic markdown is supported</p>

              <details>
                <summary>Emoji</summary>
                <div id="emojiPicker">
                  <button type="button" data-emoji="despair">
                    <img src="/img/emoji/despair.gif" alt="despair" />
                  </button>
                  <button type="button" data-emoji="nuko">
                    <img src="/img/emoji/nuko.gif" alt="nuko" />
                  </button>
                </div>
              </details>
            </span>
          </div>

          <div class="row">
            <label for="file">File</label>
            <span>
              <input id="file" name="file" type="file" />
            </span>
          </div>
        </div>

        <input type="submit" value="Post" id="postFormSubmit" />
      </form>

      <hr />

      <div id="posts">{posts}</div>
    </main>

    <script src="/js/index.js"></script>
  </body>
</html>
